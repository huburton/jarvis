[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Local French voice assistant for Linux: wake word, Whisper, local LLM with grammar-constrained tool calls, Piper."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# Heavy audio stack: only needed to run the voice daemon, not the demo or the tests.
voice = ["numpy", "sounddevice", "faster-whisper>=1.1", "openwakeword>=0.6", "piper-tts>=1.3"]
dev = ["pytest>=8", "jsonschema>=4", "ruff"]

[project.scripts]
jarvis = "jarvis.__main__:main"
jarvis-ctl = "jarvis.ctl:main"
jarvis-demo = "jarvis.demo_entry:main"

[tool.setuptools]
packages = ["jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long French prompt / phrase strings
